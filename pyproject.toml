[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudcheck"
version = "0.1.0"
description = "Flag fake proof documents sent after a motorbike-insurance subscription."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pymupdf>=1.25",
    "pillow>=10.3",
    "openpyxl>=3.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
azure = ["openai>=1.106", "azure-identity>=1.19", "python-dotenv>=1.0"]
heic = ["pillow-heif>=0.16"]
local = ["zxing-cpp>=2.2", "rapidocr-onnxruntime>=1.3", "pyspellchecker>=0.8"]
app = ["streamlit>=1.37"]
demo = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
fraudcheck = "fraudcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "real_data: runs on the organisers' documents in data/; skipped when they are absent",
]
