  { text = "D.1", source = "Directive 1999/37/CE, annexe I (certificat d'immatriculation, codes harmonisés)" },
  { text = "D.2", source = "Directive 1999/37/CE, annexe I (certificat d'immatriculation, codes harmonisés)" },
  { text = "D.2.1", source = "Fiche « Carte grise » (09/2022)" },
  { text = "D.3", source = "Directive 1999/37/CE, annexe I (certificat d'immatriculation, codes harmonisés)" },
  { text = "E", source = "Directive 1999/37/CE, annexe I (certificat d'immatriculation, codes harmonisés)" },
