# Pièce d'identité: carte nationale d'identité (ancien ou nouveau modèle) or passport.
name = "piece_identite"
family = "identity"
label = "Pièce d'identité (carte nationale d'identité ou passeport)"
natures = ["Pièce d'identité"]

fields = [
  { name = "type_document", label = "Type de document (carte d'identité, passeport)", kind = "text" },
  { name = "nom", label = "Nom", kind = "text" },
  { name = "prenoms", label = "Prénoms", kind = "text" },
  { name = "date_naissance", label = "Date de naissance", kind = "date" },
  { name = "lieu_naissance", label = "Lieu de naissance", kind = "text" },
  { name = "nationalite", label = "Nationalité", kind = "text" },
  { name = "numero_document", label = "Numéro du document (recopier aussi chaque autre exemplaire imprimé)", kind = "code" },
  { name = "date_delivrance", label = "Date de délivrance", kind = "date" },
  { name = "date_expiration", label = "Date d'expiration (fin de validité)", kind = "date" },
  { name = "mrz", label = "Lignes de lecture automatique (bande de caractères en bas)", kind = "code" },
]

elements = ["Photo du titulaire", "Signature du titulaire", "Lignes de lecture automatique", "Mention de l'État émetteur"]

date_order = [["date_naissance", "date_delivrance"], ["date_delivrance", "date_expiration"]]

# What the empty form looks like, for the inspection stage (python -m fraudcheck inspect).
# Labels: the form's own printed text, in printed order. Zones: what a genuine form always shows.
[base_form]
description = "Pièce d'identité française, recto ou verso : carte nationale d'identité modèle 1995 (photo et deux lignes de lecture automatique au bas du recto), carte au format bancaire depuis 2021 (photo au recto, trois lignes de lecture automatique au verso) ou passeport (page des données avec photo et deux lignes au bas). Les rubriques Nom puis Prénoms se suivent dans cet ordre."
source = "Modèles de la carte nationale d'identité française (1995 et 2021) et du passeport ; OACI, Doc 9303 (documents de voyage lisibles à la machine)"
layout = "fixed"  # each model (card of 1995, card of 2021, passport) is set by regulation
labels = [
  { text = "RÉPUBLIQUE FRANÇAISE", source = "Modèles de la carte nationale d'identité française (1995 et 2021) et du passeport" },
]
zones = [
  { name = "Photo du titulaire (sur la face qui porte l'identité)", where = "", source = "Modèles de la carte nationale d'identité française (1995 et 2021) et du passeport" },
  { name = "Lignes de lecture automatique (sur la face qui les porte selon le modèle)", where = "au bas de la face", source = "OACI, Doc 9303 (documents de voyage lisibles à la machine)" },
]
field_order = ["Nom", "Prénoms"]
