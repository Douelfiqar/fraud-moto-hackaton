# Makes, as a relevé prints them: used when the relevé names the make but prints no identification
# number (check bonus_malus_licence, which only judges the relevé of a car). Same principle: only
# makers of one kind of vehicle. A maker of both cars and two-wheelers (Honda, Suzuki, BMW, Peugeot,
# Seat) is in neither list, because its name alone says nothing. No model is listed, on purpose: a
# list of models is never complete.
# A make listed as a maker of two-wheelers is never judged as a car, so when in doubt a make goes
# there (Triumph and KTM also built a few cars, Piaggio small vans).
two_wheeler_makes = [
  "yamaha", "kawasaki", "ducati", "triumph", "ktm", "aprilia", "moto guzzi", "mv agusta",
