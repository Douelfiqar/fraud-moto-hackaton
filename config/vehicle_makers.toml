# Maker codes of vehicles (world manufacturer identifier, ISO 3780): the first three characters of a
# vehicle identification number name its maker.
#
# Used by the check releve_vehicle_category: a relevé that classes a vehicle as a car while its
# identification number names a maker of two-wheelers (or the reverse) contradicts itself.
# Used also to tell what kind of vehicle a relevé describes (see the makes at the end of the file).
#
# Only codes that cover ONE kind of vehicle are listed. A code shared by cars and other vehicles
# (Suzuki JSA: cars and quads; Piaggio ZAP: scooters and small vans) proves nothing and is left out:
# for such a maker, and for any maker that is not listed, the check says it cannot tell.
# Codes checked against the public list "Vehicle Identification Numbers (VIN codes) / World
# Manufacturer Identifier" (Wikibooks). To cover another maker, add its code to one of the two lists.

# Makers of motorcycles, scooters and mopeds.
two_wheelers = [
  "JYA",         # Yamaha
  "JS1",         # Suzuki
  "JH2",         # Honda
  "JKA", "JKB",  # Kawasaki
  "VBK",         # KTM
  "ZDM",         # Ducati
  "SMT",         # Triumph Motorcycles
  "WB1",         # BMW Motorrad
  "ZD4",         # Aprilia
  "ZGU",         # Moto Guzzi
  "VG5",         # MBK, Yamaha Motor (France)
  "VGA",         # Peugeot Motocycles
  "1HD",         # Harley-Davidson
  "RFB",         # Kymco
  "ME3",         # Royal Enfield
]

